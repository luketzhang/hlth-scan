<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Healthcare technology news summaries organized by six domains."><title>HLTH News Intelligence</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#16243a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#10263e,#184e6a);color:white;padding:38px max(22px,calc((100vw - 1100px)/2))}h1{font-size:clamp(27px,4vw,40px);margin:0 0 8px}header p{color:#d2e3ec;margin:0}main{max-width:1100px;margin:0 auto;padding:26px 20px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 16px}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:11px 13px;background:white;color:#16243a}input{flex:1;min-width:220px}button{cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 25px}.filters button{font-size:13px;padding:9px 12px}.filters button.active{background:#146b85;border-color:#146b85;color:white}.status{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:#53667a;font-size:13px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:16px}.card{background:white;border:1px solid #e0e6ed;border-radius:15px;padding:20px;box-shadow:0 5px 22px #163b5909;display:flex;flex-direction:column;gap:12px}.date{font-size:12px;color:#64748b}.card h2{font-size:19px;line-height:1.35;margin:0}.card p{font-size:14px;line-height:1.6;color:#41556a;margin:0}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{background:#e6f3f6;color:#145c71;border-radius:6px;padding:5px 7px;font-size:11px}.card a{color:#08708e;font-weight:650;text-decoration:none;margin-top:auto}.card a:hover{text-decoration:underline}.notice{padding:20px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;color:#475569}footer{padding:30px 20px;text-align:center;color:#64748b;font-size:12px}@media(max-width:600px){header{padding:28px 20px}.toolbar>*{width:100%}}
</style></head><body>
<header><h1>HLTH News Intelligence</h1><p>Healthcare technology news, organized around six strategic domains</p></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Search headlines and summaries…" aria-label="Search articles"><select id="sort" aria-label="Sort articles"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">Headline A–Z</option></select><button id="reload">Refresh page data</button></div><nav class="filters" id="filters" aria-label="Filter by domain"></nav><div class="status"><span id="count">Loading articles…</span><span id="updated"></span></div><section id="cards" class="cards" aria-live="polite"></section></main>
<footer>Independent news dashboard · Source: <a href="https://hlth.com/insights/news" target="_blank" rel="noopener noreferrer">HLTH Insights News</a> · Summaries are automated previews; verify details in the original article.</footer>
<script>
const DOMAINS=['All News','Patient Access and Engagement','Clinical Decision Support','Behavioral Health & Digital Therapeutics','Care Operations and Coordination','Virtual & Hybrid Care Delivery','Remote Monitoring','Uncategorized'];
const state={articles:[],domain:'All News'};
const $=id=>document.getElementById(id);
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function filters(){const root=$('filters');root.replaceChildren();for(const domain of DOMAINS){const btn=node('button',domain+(domain==='All News'?'':` (${state.articles.filter(a=>(a.domains||[]).includes(domain)).length})`));btn.className=domain===state.domain?'active':'';btn.setAttribute('aria-pressed',String(domain===state.domain));btn.addEventListener('click',()=>{state.domain=domain;filters();render()});root.append(btn)}}
function render(){const q=$('search').value.toLowerCase().trim();const articles=state.articles.filter(a=>(state.domain==='All News'||(a.domains||[]).includes(state.domain))&&[a.title,a.summary,(a.domains||[]).join(' ')].join(' ').toLowerCase().includes(q));const sort=$('sort').value;articles.sort((a,b)=>sort==='az'?a.title.localeCompare(b.title):sort==='oldest'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));$('count').textContent=`${articles.length} article${articles.length===1?'':'s'} shown`;const root=$('cards');root.replaceChildren();if(!articles.length){root.append(node('div','No matching articles. Try another filter or search term.','notice'));return}for(const a of articles){const card=node('article',undefined,'card');card.append(node('span',a.date||'Date unavailable','date'));card.append(node('h2',a.title));card.append(node('p',a.summary||'Summary unavailable.'));const tags=node('div',undefined,'tags');for(const d of a.domains||['Uncategorized'])tags.append(node('span',d,'tag'));card.append(tags);const link=node('a','Read original article ↗');link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';card.append(link);root.append(card)}}
async function load(){try{const r=await fetch('data/news.json?cache='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.articles))throw Error('Invalid news data');state.articles=data.articles;const dt=data.updated_at?new Date(data.updated_at):null;$('updated').textContent=dt&&!isNaN(dt)?'Data updated: '+dt.toLocaleString():'Update time unavailable';filters();render()}catch(e){$('count').textContent='News unavailable';$('updated').textContent='Unable to load live data';$('cards').replaceChildren(node('div','News data could not be loaded. On GitHub Pages, confirm that the scheduled fetch workflow has run successfully.','notice'));console.error(e)}}
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('reload').addEventListener('click',load);load();setInterval(load,15*60*1000);
</script></body></html>
